name: sync-upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/yonggekkk/Cloudflare-vless-trojan.git || true
          git fetch upstream main
          git merge --no-edit upstream/main

      - name: Rebuild site copies
        run: |
          set -euo pipefail
          build() {
            src="$1"; dst="$2"; strip_node="$3"
            if [ ! -f "$src" ]; then echo "::error::missing $src"; exit 1; fi
            mkdir -p "$(dirname "$dst")"
            python3 - "$src" "$dst" "$strip_node" <<'PYEOF'
          import sys
          src, dst, strip_node = sys.argv[1], sys.argv[2], sys.argv[3] == "1"
          s = open(src, encoding="utf-8").read()
          s = s.replace('const proxyIPs = ["pyip.ygkkk.dpdns.org"];', 'const proxyIPs = [""];')
          assert 'const proxyIPs = [""];' in s, "proxyIP default changed upstream, aborting"
          if strip_node:
              # js-sha256 的 node 分支：esbuild 解析不了 require("crypto")，且边缘运行时没有 process
              s = s.replace('var crypto = require("crypto");', 'var crypto = null;')
              s = s.replace('var Buffer = require("buffer").Buffer;', 'var Buffer = null;')
              assert 'require("crypto")' not in s, "require patch failed"
          open(dst, "w", encoding="utf-8").write(s)
          PYEOF
          }
          build "Vless_workers_pages/_worker明.js"  "site-a/_worker.js" 0
          build "Trojan_workers_pages/_worker明.js" "site-b/_worker.js" 1

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "sync: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
