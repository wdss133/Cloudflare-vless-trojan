name: sync-upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream
        run: |
          git config user.name "cf-sync-bot"
          git config user.email "cf-sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/yonggekkk/Cloudflare-vless-trojan.git || true
          git fetch upstream main
          git merge --no-edit upstream/main

      - name: Rebuild deploy copies (proxyIP forced empty)
        run: |
          set -euo pipefail
          build() {
            src="$1"; dst="$2"
            if [ ! -f "$src" ]; then echo "::error::missing $src"; exit 1; fi
            mkdir -p "$(dirname "$dst")"
            python3 - "$src" "$dst" <<'PYEOF'
          import sys
          src, dst = sys.argv[1], sys.argv[2]
          s = open(src, encoding="utf-8").read()
          s = s.replace('const proxyIPs = ["pyip.ygkkk.dpdns.org"];', 'const proxyIPs = [""];')
          assert 'const proxyIPs = [""];' in s, "proxyIP default changed upstream, aborting"
          open(dst, "w", encoding="utf-8").write(s)
          PYEOF
          }
          build "Vless_workers_pages/_worker明.js"  "deploy-vless/_worker.js"
          build "Trojan_workers_pages/_worker明.js" "deploy-trojan/_worker.js"

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "sync: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
