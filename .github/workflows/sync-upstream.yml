name: sync-upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream
        run: |
          git config user.name "cf-sync-bot"
          git config user.email "cf-sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/yonggekkk/Cloudflare-vless-trojan.git || true
          git fetch upstream main
          git merge --no-edit upstream/main

      - name: Rebuild deploy copies (proxyIP forced empty)
        run: |
          set -euo pipefail
          for pair in "Vless_workers_pages/_worker.js:deploy-vless/_worker.js" \
                      "Trojan_workers_pages/_worker.js:deploy-trojan/_worker.js"; do
            src="${pair%%:*}"
            dst="${pair##*:}"
            mkdir -p "$(dirname "$dst")"
            if ! grep -q 'const proxyIPs = \["pyip.ygkkk.dpdns.org"\];' "$src"; then
              echo "::error::$src 里 proxyIP 默认值已变化，请人工确认后再同步"
              exit 1
            fi
            sed 's/const proxyIPs = \["pyip.ygkkk.dpdns.org"\];/const proxyIPs = [""];/' "$src" > "$dst"
          done

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "sync: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
